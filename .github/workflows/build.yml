name: Build & Test (macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Package MacReader.app
        run: |
          ./scripts/build_app.sh
          ditto -c -k --keepParent build/MacReader.app build/MacReader.zip

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: MacReader-app
          path: build/MacReader.zip
